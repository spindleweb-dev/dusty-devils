<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dusty Devils</title>
<style>
  html, body { margin: 0; height: 100%; background: #14110d; color: #e8dcc6;
    font-family: "Trebuchet MS", system-ui, sans-serif; overflow: hidden; }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 8px; }
  #screen { position: relative; width: min(96vw, calc((100vh - 64px) * 1.6)); aspect-ratio: 16 / 10;
    border-radius: 6px; overflow: hidden; background: #000;
    box-shadow: 0 0 0 3px #2a2118, 0 10px 40px rgba(0,0,0,.6); }
  #screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #screen.classic canvas { image-rendering: pixelated; }
  #help { font-size: 13px; opacity: .75; text-align: center; padding: 0 8px; }
  #help b { color: #ffc861; font-weight: 600; }
  #tune { position: fixed; top: 10px; right: 10px; width: 270px; max-height: calc(100vh - 20px); overflow-y: auto;
    background: rgba(20,16,12,.94); border: 1px solid #5a4630; border-radius: 8px; padding: 10px 12px; font-size: 12px; z-index: 5; }
  #tune h3 { margin: 12px 0 6px; font-size: 13px; color: #ffc861; letter-spacing: .05em; }
  #tune h3:first-child { margin-top: 4px; }
  #tune label { display: block; margin: 6px 0 1px; }
  #tune label span { float: right; color: #ffc861; font-variant-numeric: tabular-nums; }
  #tune input[type=range] { width: 100%; accent-color: #d9893b; }
  #tune .row { display: flex; gap: 6px; margin-top: 10px; }
  #tune button { flex: 1; background: #3a2c1e; color: #e8dcc6; border: 1px solid #6b5338; border-radius: 4px; padding: 5px; cursor: pointer; font: inherit; }
  #tune button:hover { background: #4d3a27; }
  #tune .note { opacity: .6; margin-top: 8px; line-height: 1.35; }
  #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 20px; color: #ffc861; }
</style>
</head>
<body>
<div id="wrap">
  <div id="screen">
    <canvas id="gl"></canvas>
    <canvas id="hud"></canvas>
    <div id="err"></div>
  </div>
  <div id="help">
    <b>↑/W</b> accelerate · <b>↓/S</b> brake / reverse · <b>←→ / A D</b> steer · <b>Space</b> nitro ·
    <b>R</b> reset · <b>G</b> classic/enhanced · <b>T</b> tuning · <b>Shift+D</b> debug · <b>M</b> sound
  </div>
</div>
<div id="tune" hidden>
  <h3>HANDLING</h3>
  <div id="sliders"></div>
  <div class="row"><button id="tReset">Reset handling</button><button id="tCopy">Copy settings</button></div>
  <h3>CAMERA</h3>
  <div id="camSliders"></div>
  <div class="row"><button id="cReset">Reset camera</button></div>
  <div class="note">Settings are saved in this browser. Tilt 90° gives a straight-down view; lower tilt and wider lens give more perspective.</div>
</div>

<script type="module">
// ============================================================
//  DUSTY DEVILS — 3D perspective view
//  The race itself still runs on a flat 320×200 "world" (same
//  physics as step 1). three.js draws it from a fixed, tilted
//  camera like the old single-screen arcade racers.
//  World x → three x, world y → three z, height → three y.
// ============================================================
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const W = 320, H = 200;
const STEP = 1 / 120;

function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function recall(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

// ---------- Physics settings (live-tunable) ----------
const PHYS_DEFAULTS = {
  accel: 150, maxSpeed: 118, reverseMax: 45, brake: 260, rollDrag: 0.35,
  steerRate: 3.6, steerFullSpeed: 40, latGrip: 9, latMax: 240, throttleSlip: 0.45,
  wallBounce: 0.35, wallScrub: 0.82,
  nitroSpeed: 1.45, nitroAccel: 2.6, nitroTime: 1.5, pickupEvery: 4.5,
  exhaustTin: 0.35, engineBass: 7, blowerWhine: 0.3
};
const PHYS_META = [
  ["accel", "Acceleration", 40, 400, 5],
  ["maxSpeed", "Top speed", 40, 250, 1],
  ["reverseMax", "Reverse speed", 10, 120, 1],
  ["brake", "Brakes", 50, 600, 10],
  ["rollDrag", "Rolling drag", 0, 2, 0.05],
  ["steerRate", "Steering rate", 1, 8, 0.1],
  ["steerFullSpeed", "Full steering from speed", 0, 120, 1],
  ["latGrip", "Grip stiffness", 0.5, 30, 0.5],
  ["latMax", "Grip limit (lower = drift)", 40, 800, 5],
  ["throttleSlip", "Power-slide on throttle", 0, 0.95, 0.05],
  ["wallBounce", "Wall bounce", 0, 1, 0.05],
  ["wallScrub", "Speed kept on wall hit", 0.3, 1, 0.01],
  ["nitroSpeed", "Nitro top-speed boost", 1, 2.5, 0.05],
  ["nitroAccel", "Nitro push", 1, 6, 0.1],
  ["nitroTime", "Nitro burst (s)", 0.3, 4, 0.1],
  ["pickupEvery", "New pickup every (s)", 1, 15, 0.5],
  ["exhaustTin", "Exhaust tinniness (sound)", 0, 1.5, 0.05],
  ["engineBass", "Engine bass boost (dB)", 0, 15, 0.5],
  ["blowerWhine", "Supercharger whine (sound)", 0, 1.5, 0.05]
];
const P = Object.assign({}, PHYS_DEFAULTS, recall("dd_phys") || {});

// ---------- Camera settings ----------
const CAM_DEFAULTS = { tilt: 56, fov: 34, lean: 1, zoom: 1.06 };
const CAM_META = [
  ["tilt", "Tilt (90 = straight down)", 25, 90, 1],
  ["fov", "Lens angle (perspective)", 10, 75, 1],
  ["zoom", "Zoom", 0.8, 1.6, 0.01],
  ["lean", "Truck body lean", 0, 2, 0.05]
];
const CAM = Object.assign({}, CAM_DEFAULTS, recall("dd_cam") || {});

// ---------- Track: closed Catmull-Rom spline ----------
const HW = 14;          // half width of the dirt
const TRUCK_R = 4;      // collision radius
const TRACK_PTS = [
  [40, 72], [75, 34], [170, 32], [268, 35], [295, 72], [245, 94], [182, 92],
  [163, 115], [195, 133], [283, 145], [273, 177], [150, 178], [58, 175], [27, 134]
];
const track = buildTrack(TRACK_PTS, 1.5, 150);

function buildTrack(pts, spacing, startX) {
  const dense = [];
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for (let k = 0; k < 40; k++) {
      const t = k / 40, t2 = t * t, t3 = t2 * t;
      dense.push([
        0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
      ]);
    }
  }
  const out = [{ x: dense[0][0], y: dense[0][1] }];
  let acc = 0;
  for (let i = 1; i <= dense.length; i++) {
    const a = dense[i - 1], b = dense[i % dense.length];
    const seg = Math.hypot(b[0] - a[0], b[1] - a[1]);
    let pos = 0;
    while (acc + (seg - pos) >= spacing) {
      pos += spacing - acc; acc = 0;
      const f = pos / seg;
      out.push({ x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f });
    }
    acc += seg - pos;
  }
  if (Math.hypot(out[out.length - 1].x - out[0].x, out[out.length - 1].y - out[0].y) < spacing * 0.5) out.pop();
  let best = 0, bd = 1e9;
  out.forEach((p, i) => { const d = Math.abs(p.x - startX) + Math.abs(p.y - 32) * 3; if (d < bd) { bd = d; best = i; } });
  const s = out.slice(best).concat(out.slice(0, best));
  let len = 0;
  for (let i = 0; i < s.length; i++) {
    const a = s[(i - 1 + s.length) % s.length], b = s[(i + 1) % s.length];
    const tl = Math.hypot(b.x - a.x, b.y - a.y);
    s[i].tx = (b.x - a.x) / tl; s[i].ty = (b.y - a.y) / tl;
    s[i].s = len;
    const nx = s[(i + 1) % s.length];
    len += Math.hypot(nx.x - s[i].x, nx.y - s[i].y);
  }
  return { pts: s, len };
}

function nearest(x, y) {
  const p = track.pts, n = p.length;
  let bi = 0, bd = 1e18;
  for (let i = 0; i < n; i++) {
    const dx = p[i].x - x, dy = p[i].y - y, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; bi = i; }
  }
  let best = null;
  for (const j of [bi - 1, bi]) {
    const a = p[(j + n) % n], b = p[(j + 1 + n) % n];
    const ex = b.x - a.x, ey = b.y - a.y, el = ex * ex + ey * ey;
    let f = ((x - a.x) * ex + (y - a.y) * ey) / el;
    f = Math.max(0, Math.min(1, f));
    const px = a.x + ex * f, py = a.y + ey * f;
    const d = Math.hypot(x - px, y - py);
    if (!best || d < best.d) {
      let s = a.s + f * Math.sqrt(el);
      if (s >= track.len) s -= track.len;
      best = { d, px, py, s, i: (j + n) % n };
    }
  }
  return best;
}

// ---------- Ground texture (painted flat, laid on the 3D ground) ----------
// Covers world x -60..380, y -60..250 so the scenery runs past the track.
const GX0 = -60, GY0 = -60, GW = 440, GH = 310;

function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
function trackPath(c) {
  c.beginPath();
  track.pts.forEach((p, i) => i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y));
  c.closePath();
}

function paintGround(S, classic) {
  const c = document.createElement("canvas");
  c.width = Math.round(GW * S); c.height = Math.round(GH * S);
  const g = c.getContext("2d");
  g.setTransform(S, 0, 0, S, -GX0 * S, -GY0 * S);
  g.lineJoin = g.lineCap = "round";
  const R = rng(7);

  g.fillStyle = classic ? "#3f7a2a" : "#4a7c30";
  g.fillRect(GX0, GY0, GW, GH);
  const speck = classic ? 900 : 16000;
  for (let i = 0; i < speck; i++) {
    const v = R();
    g.fillStyle = v < 0.5 ? "rgba(30,60,18,.35)" : v < 0.85 ? "rgba(110,160,60,.3)" : "rgba(160,150,80,.25)";
    const sz = classic ? 1 : 0.25 + R() * 0.6;
    g.fillRect(GX0 + R() * GW, GY0 + R() * GH, sz, sz * (classic ? 1 : 1.8));
  }
  if (!classic) {
    for (let x = GX0 - GH; x < GX0 + GW; x += 24) {   // mown stripes
      g.fillStyle = "rgba(255,255,255,.03)";
      g.beginPath(); g.moveTo(x, GY0); g.lineTo(x + 12, GY0); g.lineTo(x + 12 + GH * 0.5, GY0 + GH); g.lineTo(x + GH * 0.5, GY0 + GH); g.fill();
    }
  }
  // dirt apron where the tyre walls sit
  trackPath(g); g.strokeStyle = classic ? "#5a4026" : "#5d4529"; g.lineWidth = HW * 2 + 10; g.stroke();

  // dirt surface on its own layer so it can be textured
  const d = document.createElement("canvas");
  d.width = c.width; d.height = c.height;
  const dg = d.getContext("2d");
  dg.setTransform(S, 0, 0, S, -GX0 * S, -GY0 * S);
  dg.lineJoin = dg.lineCap = "round";
  trackPath(dg); dg.strokeStyle = "#7c5530"; dg.lineWidth = HW * 2 + 1; dg.stroke();
  trackPath(dg); dg.strokeStyle = classic ? "#b07a44" : "#a8743f"; dg.lineWidth = HW * 2 - 3; dg.stroke();
  dg.globalCompositeOperation = "source-atop";
  const blot = classic ? 120 : 1400;
  for (let i = 0; i < blot; i++) {
    const p = track.pts[(R() * track.pts.length) | 0];
    const off = (R() - 0.5) * HW * 2.2;
    const x = p.x - p.ty * off, y = p.y + p.tx * off;
    const r = classic ? 1 : 0.6 + R() * 3.2;
    dg.fillStyle = R() < 0.55 ? "rgba(90,58,28,.18)" : "rgba(210,165,105,.16)";
    dg.beginPath(); dg.ellipse(x, y, r, r * 0.7, R() * 3, 0, Math.PI * 2); dg.fill();
  }
  if (!classic) {
    for (let i = 0; i < 14000; i++) {
      const p = track.pts[(R() * track.pts.length) | 0];
      const off = (R() - 0.5) * HW * 2;
      dg.fillStyle = R() < 0.5 ? "rgba(60,38,18,.45)" : "rgba(235,200,150,.35)";
      dg.fillRect(p.x - p.ty * off + (R() - .5), p.y + p.tx * off + (R() - .5), 0.3, 0.3);
    }
    dg.globalAlpha = 0.18; trackPath(dg); dg.strokeStyle = "#5e3d1d"; dg.lineWidth = HW * 0.9; dg.stroke(); dg.globalAlpha = 1;
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(d, 0, 0);
  g.setTransform(S, 0, 0, S, -GX0 * S, -GY0 * S);

  // start / finish chequers
  const s0 = track.pts[0];
  const nx = -s0.ty, ny = s0.tx;
  const sq = classic ? 2 : 1.75;
  for (let k = -HW; k < HW; k += sq) {
    for (let row = 0; row < 2; row++) {
      const white = (Math.round((k + HW) / sq) + row) % 2 === 0;
      g.fillStyle = white ? "#f4f0e6" : "#151515";
      const bx = s0.x + nx * k + s0.tx * (row * sq - sq), by = s0.y + ny * k + s0.ty * (row * sq - sq);
      g.save(); g.translate(bx, by); g.rotate(Math.atan2(s0.ty, s0.tx)); g.fillRect(0, 0, sq + 0.05, sq + 0.05); g.restore();
    }
  }
  return c;
}

// ---------- three.js setup ----------
const screenEl = document.getElementById("screen");
const glCanvas = document.getElementById("gl");
const hud = document.getElementById("hud");
const hctx = hud.getContext("2d");

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: false, powerPreference: "high-performance" });
} catch (e) {
  const el = document.getElementById("err");
  el.style.display = "flex";
  el.textContent = "Sorry, this browser couldn't start WebGL, which the 3D view needs.";
  throw e;
}
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#8fb6d6");
scene.fog = new THREE.Fog("#8fb6d6", 600, 1400);
const camera = new THREE.PerspectiveCamera(CAM.fov, W / H, 5, 3000);

// lights
scene.add(new THREE.HemisphereLight("#dfeeff", "#5a4a30", 1.25));
const sun = new THREE.DirectionalLight("#fff3dd", 2.3);
sun.position.set(40, 260, 10);
sun.target.position.set(160, 0, 100);
scene.add(sun, sun.target);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -240, right: 240, top: 220, bottom: -220, near: 10, far: 700 });
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.3;

// ground
const groundMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(GW, GH), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(GX0 + GW / 2, 0, GY0 + GH / 2);
ground.receiveShadow = true;
scene.add(ground);
const farGround = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshLambertMaterial({ color: "#3f6c29" }));
farGround.rotation.x = -Math.PI / 2;
farGround.position.set(160, -0.15, 100);
scene.add(farGround);

// ---------- Tyre walls (instanced) ----------
const tyreSpots = [];
for (const side of [-1, 1]) {
  let last = null;
  for (const p of track.pts) {
    const off = side * (HW + 2.2);
    const x = p.x - p.ty * off, y = p.y + p.tx * off;
    if (last && Math.hypot(x - last[0], y - last[1]) < 3.7) continue;
    // keep tyres that would sit on the dirt of another part of the track off it
    if (nearest(x, y).d < HW + 1) continue;
    last = [x, y];
    tyreSpots.push([x, y]);
  }
}
const tyreGeo = new THREE.TorusGeometry(1.45, 0.7, 6, 12);
tyreGeo.rotateX(Math.PI / 2);
const tyreMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
const tyres = new THREE.InstancedMesh(tyreGeo, tyreMat, tyreSpots.length * 2);
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), col = new THREE.Color();
  const R = rng(3);
  let k = 0;
  tyreSpots.forEach(([x, y], i) => {
    for (let lvl = 0; lvl < 2; lvl++) {
      e.set((R() - 0.5) * 0.12, R() * 6, (R() - 0.5) * 0.12);
      q.setFromEuler(e);
      m.compose(new THREE.Vector3(x + (R() - .5) * .4, 0.7 + lvl * 1.35, y + (R() - .5) * .4), q, new THREE.Vector3(1, 1, 1));
      tyres.setMatrixAt(k, m);
      // mostly black, with painted white bands every so often
      // painted in a repeating red / white / black pattern, two stacks per colour
      col.set(["#c8231b", "#ece7da", "#1b1b1b"][Math.floor(i / 2) % 3]).multiplyScalar(0.88 + R() * 0.24);
      tyres.setColorAt(k, col);
      k++;
    }
  });
}
tyres.castShadow = tyres.receiveShadow = true;
scene.add(tyres);

// ---------- Scenery: grandstand, crowd, banner, bushes ----------
const scenery = new THREE.Group();
scene.add(scenery);
function box(w, h, d, color, x, y, z, parent = scenery) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
// grandstand along the far (top) side, facing the camera
{
  const x0 = 70, x1 = 250, cx = (x0 + x1) / 2, wdt = x1 - x0;
  const steps = 5, depth = 5, rise = 2.6, front = -6;
  for (let i = 0; i < steps; i++) box(wdt, rise * (i + 1), depth, i % 2 ? "#8c8579" : "#9c958a", cx, rise * (i + 1) / 2, front - i * depth - depth / 2);
  box(wdt, rise * steps + 9, 1.2, "#5d5a55", cx, (rise * steps + 9) / 2, front - steps * depth - 0.6);
  // roof on posts
  const roofY = rise * steps + 10;
  box(wdt + 4, 0.8, steps * depth + 4, "#b8412f", cx, roofY, front - steps * depth / 2);
  for (let x = x0; x <= x1; x += 30) box(0.8, roofY, 0.8, "#444", x, roofY / 2, front - 0.8);
  // sign along the front edge of the roof
  const sc = document.createElement("canvas");
  sc.width = 1024; sc.height = 64;
  const s = sc.getContext("2d");
  s.fillStyle = "#c22e22"; s.fillRect(0, 0, 1024, 64);
  s.fillStyle = "#ffc861"; s.fillRect(0, 5, 1024, 4); s.fillRect(0, 55, 1024, 4);
  s.font = "bold 38px 'Trebuchet MS', sans-serif"; s.textAlign = "center"; s.textBaseline = "middle"; s.fillStyle = "#fff";
  s.fillText("DUSTY DEVILS  ·  DIRT TRACK RACING", 512, 33);
  const stex = new THREE.CanvasTexture(sc); stex.colorSpace = THREE.SRGBColorSpace;
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(wdt + 4, (wdt + 4) / 16), new THREE.MeshBasicMaterial({ map: stex }));
  sign.position.set(cx, roofY - 0.4, front + 2.05);
  sign.rotation.x = -0.35;
  scenery.add(sign);
  // crowd
  const R = rng(11);
  const per = Math.floor(wdt / 1.6);
  const crowd = new THREE.InstancedMesh(new THREE.BoxGeometry(1.0, 1.7, 0.9), new THREE.MeshLambertMaterial({ color: 0xffffff }), per * steps);
  const m = new THREE.Matrix4(), col = new THREE.Color();
  const shirts = ["#d8342c", "#2e6bd1", "#f2c230", "#ffffff", "#3aa057", "#e07b28", "#7a4fc0", "#222"];
  let k = 0;
  for (let i = 0; i < steps; i++) for (let j = 0; j < per; j++) {
    if (R() < 0.18) continue;
    m.makeTranslation(x0 + 1 + j * 1.6 + (R() - .5) * .5, rise * (i + 1) + 0.85, front - i * depth - depth / 2 + (R() - .5));
    crowd.setMatrixAt(k, m);
    crowd.setColorAt(k, col.set(shirts[(R() * shirts.length) | 0]));
    k++;
  }
  crowd.count = k;
  crowd.castShadow = true;
  scenery.add(crowd);
  // advertising boards along the front of the stand
  for (let x = x0; x < x1; x += 20) box(19, 2.4, 0.5, ["#f2c230", "#ffffff", "#d8342c"][(x / 20) % 3 | 0], x + 10, 1.2, front + 2);
}
// bushes
{
  const R = rng(99);
  const spots = [];
  for (let i = 0; i < 400 && spots.length < 60; i++) {
    const x = GX0 + 10 + R() * (GW - 20), y = -12 + R() * 245;
    if (nearest(x, y).d < HW + 8) continue;
    if (y < -8 && x > 60 && x < 260) continue;
    spots.push([x, y, 1.8 + R() * 2.6]);
  }
  const bush = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true }), spots.length);
  const m = new THREE.Matrix4(), col = new THREE.Color(), q = new THREE.Quaternion();
  spots.forEach(([x, y, r], i) => {
    q.setFromEuler(new THREE.Euler(R(), R() * 6, R()));
    m.compose(new THREE.Vector3(x, r * 0.55, y), q, new THREE.Vector3(r, r * 0.85, r));
    bush.setMatrixAt(i, m);
    bush.setColorAt(i, col.set(R() < 0.5 ? "#3d6f27" : "#4f8a33"));
  });
  bush.castShadow = bush.receiveShadow = true;
  scenery.add(bush);
}

// ---------- The truck model ----------
function makeTruckModel(c) {
  const root = new THREE.Group();          // position + heading
  const body = new THREE.Group();          // leans with the suspension
  root.add(body);
  const mat = (color, extra = {}) => new THREE.MeshLambertMaterial(Object.assign({ color }, extra));
  const add = (geo, m, x, y, z, parent = body) => {
    const mesh = new THREE.Mesh(geo, m); mesh.position.set(x, y, z);
    mesh.castShadow = true; mesh.receiveShadow = true; parent.add(mesh); return mesh;
  };
  const paint = mat(c.color), dark = mat(c.dark), light = mat(c.light);
  const black = mat("#1b1b1b"), glass = mat("#2b3a4a"), chrome = mat("#cfcfcf");
  // chassis tub + nose
  add(new THREE.BoxGeometry(10.6, 1.5, 5.6), paint, 0, 2.5, 0);
  add(new THREE.BoxGeometry(2.4, 1.0, 5.0), paint, 4.6, 3.6, 0).rotation.z = -0.18;   // sloped bonnet
  add(new THREE.BoxGeometry(0.5, 1.0, 6.2), black, 5.5, 2.1, 0);                      // front bumper
  add(new THREE.BoxGeometry(0.5, 0.8, 6.0), black, -5.4, 2.0, 0);                     // rear bumper
  // cab
  add(new THREE.BoxGeometry(3.4, 2.4, 5.0), light, 1.4, 4.4, 0);
  add(new THREE.BoxGeometry(0.2, 1.6, 4.4), glass, 3.15, 4.6, 0);                      // windscreen
  add(new THREE.BoxGeometry(2.4, 1.2, 5.06), glass, 1.3, 4.7, 0);                      // side windows
  add(new THREE.BoxGeometry(3.6, 0.3, 5.2), paint, 1.4, 5.7, 0);                       // roof
  // load bed
  add(new THREE.BoxGeometry(4.6, 0.25, 5.0), dark, -2.8, 3.35, 0);
  for (const z of [-2.45, 2.45]) add(new THREE.BoxGeometry(4.6, 0.9, 0.2), paint, -2.8, 3.7, z);
  add(new THREE.BoxGeometry(0.2, 0.9, 5.0), paint, -5.05, 3.7, 0);
  // roll bar + light bar
  for (const z of [-2.2, 2.2]) add(new THREE.BoxGeometry(0.35, 3.2, 0.35), black, -0.6, 4.9, z);
  add(new THREE.BoxGeometry(0.35, 0.35, 4.75), black, -0.6, 6.4, 0);
  for (const z of [-1.5, -0.5, 0.5, 1.5]) add(new THREE.BoxGeometry(0.4, 0.5, 0.6), mat("#fff3b0", { emissive: "#806a20" }), -0.35, 6.75, z);
  // exhaust pipe (nitro flames come out here)
  { const ex = add(new THREE.CylinderGeometry(0.35, 0.35, 1.2, 6), chrome, -5.6, 2.2, 1.9); ex.rotation.z = Math.PI / 2; }
  // headlights
  for (const z of [-2.0, 2.0]) add(new THREE.BoxGeometry(0.3, 0.6, 0.9), mat("#fff8d0", { emissive: "#b0a060" }), 5.35, 3.0, z);
  // racing stripe + number panel on the doors
  for (const z of [-2.81, 2.81]) add(new THREE.BoxGeometry(10.2, 0.35, 0.05), mat("#ffffff"), 0, 2.9, z);
  // wheels (not leaning)
  const wheelGeo = new THREE.CylinderGeometry(1.55, 1.55, 1.5, 14);
  wheelGeo.rotateX(Math.PI / 2);
  const hubGeo = new THREE.CylinderGeometry(0.7, 0.7, 1.56, 8);
  hubGeo.rotateX(Math.PI / 2);
  const wheels = [];
  for (const [x, z, front] of [[3.5, -3.1, 1], [3.5, 3.1, 1], [-3.5, -3.1, 0], [-3.5, 3.1, 0]]) {
    const steer = new THREE.Group(); steer.position.set(x, 1.55, z); root.add(steer);
    const spin = new THREE.Group(); steer.add(spin);
    const w = new THREE.Mesh(wheelGeo, black); w.castShadow = true; spin.add(w);
    const h = new THREE.Mesh(hubGeo, chrome); spin.add(h);
    // tread blocks so you can see the wheels turn
    for (let k = 0; k < 6; k++) {
      const t = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 1.52), mat("#333"));
      const a = k / 6 * Math.PI * 2;
      t.position.set(Math.cos(a) * 1.5, Math.sin(a) * 1.5, 0); t.rotation.z = a;
      spin.add(t);
    }
    wheels.push({ steer, spin, front });
  }
  return { root, body, wheels };
}

skidGeo.setAttribute("position", new THREE.BufferAttribute(skidPos, 3).setUsage(THREE.DynamicDrawUsage));
skidGeo.setAttribute("color", new THREE.BufferAttribute(skidCol, 4).setUsage(THREE.DynamicDrawUsage));

  vertexColors: true, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2

let skidNext = 0, skidCount = 0, skidDirty = false;
function addSkid(x0, y0, x1, y1, w, alpha) {
  const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy);
  if (l < 0.01) return;
  const nx = -dy / l * w / 2, ny = dx / l * w / 2, y = 0.04;
  const v = [
    [x0 + nx, y0 + ny], [x0 - nx, y0 - ny], [x1 + nx, y1 + ny],
    [x1 + nx, y1 + ny], [x0 - nx, y0 - ny], [x1 - nx, y1 - ny]
  ];
  const i = skidNext;
  for (let k = 0; k < 6; k++) {
    skidPos.set([v[k][0], y, v[k][1]], (i * 6 + k) * 3);
    skidCol.set([0.2, 0.12, 0.05, alpha], (i * 6 + k) * 4);
  }
  skidNext = (skidNext + 1) % SKID_MAX;
  skidCount = Math.min(SKID_MAX, skidCount + 1);
  skidDirty = true;
}
function clearSkids() { skidCount = 0; skidNext = 0; skidCol.fill(0); skidDirty = true; }

function resize() {

// Place the fixed camera so the whole track fits, whatever tilt / lens is chosen.
function fitCamera() {
  camera.fov = CAM.fov;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  const tilt = THREE.MathUtils.degToRad(Math.min(89.9, CAM.tilt));
  const pts = [];
  for (const [x, z] of [[8, 10], [312, 10], [8, 196], [312, 196], [160, 10], [160, 196]]) {
    pts.push(new THREE.Vector3(x, 0, z), new THREE.Vector3(x, 3, z));
  }
  const target = new THREE.Vector3(160, 0, 103);
  const v = new THREE.Vector3();
  const place = (dist) => {
    camera.position.set(target.x, target.y + Math.sin(tilt) * dist, target.z + Math.cos(tilt) * dist);
    camera.lookAt(target);
    camera.updateMatrixWorld();
  };
  const topLimit = 0.72;     // leave room for the HUD strip and the grandstand
  for (let iter = 0; iter < 8; iter++) {
    let lo = 20, hi = 5000;
    for (let k = 0; k < 40; k++) {
      const mid = (lo + hi) / 2;
      place(mid);
      let ok = true;
      for (const p of pts) {
        v.copy(p).project(camera);
        if (v.z > 1 || Math.abs(v.x) > 0.98 || v.y > topLimit || v.y < -0.98) { ok = false; break; }
      }
      if (ok) hi = mid; else lo = mid;
    }
    place(hi);
    // centre vertically between the HUD and the bottom edge
    let ymin = 9, ymax = -9;
    for (const p of pts) { v.copy(p).project(camera); ymin = Math.min(ymin, v.y); ymax = Math.max(ymax, v.y); }
    const err = ((topLimit - ymax) - (ymin + 0.98)) / 2;
    if (Math.abs(err) < 0.002) break;
    target.z += err * 60 / Math.max(0.3, Math.sin(tilt));
  }
  const zoomFit = camera.position.clone().sub(target);
  camera.position.copy(target).add(zoomFit.multiplyScalar(1 / CAM.zoom));
  camera.lookAt(target);
}

// ---------- Truck state ----------
const truck = { color: "#d8342c", dark: "#7d1913", light: "#ef4b3d" };
const model = makeTruckModel(truck);
scene.add(model.root);

const keys = {};
let raceTime = 0;
const particles = [];

function resetTruck() {
  const n = track.pts.length;
  const p = track.pts[(n - 14) % n];
  Object.assign(truck, {
    x: p.x, y: p.y, a: Math.atan2(p.ty, p.tx), vx: 0, vy: 0, steerVis: 0, slide: 0,
    timing: false, lapStart: 0, laps: 0, halfway: false, lastLap: null,
    best: recall("dd_best"), prevS: nearest(p.x, p.y).s,
    nitros: 3, boost: 0, cash: recall("dd_cash") || 0,
    roll: 0, pitch: 0, wheelRot: 0, vf: 0, thr: 0, wl: null, wr: null, latAcc: 0, lonAcc: 0
  });
  clearSkids();
  particles.length = 0;
  flames.length = 0;
  for (const pk of pickups) scene.remove(pk.obj);
  pickups.length = 0;
  pickupTimer = 2;
  popups.length = 0;
}

function updateTruck(t, dt) {
  if (t.boost > 0) t.boost = Math.max(0, t.boost - dt);
  const boosting = t.boost > 0;
  const thr = keys.up || boosting ? 1 : 0;
  const topSpeed = P.maxSpeed * (boosting ? P.nitroSpeed : 1);
  const accel = P.accel * (boosting ? P.nitroAccel : 1);
  const brk = keys.down ? 1 : 0;
  const st = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);

  let fx = Math.cos(t.a), fy = Math.sin(t.a);
  const vfPrev = t.vx * fx + t.vy * fy;
  const steerScale = Math.min(1, Math.abs(vfPrev) / Math.max(1, P.steerFullSpeed));
  t.a += st * P.steerRate * steerScale * (vfPrev < -1 ? -1 : 1) * dt;
  t.steerVis += (st * 0.45 - t.steerVis) * Math.min(1, dt * 14);

  fx = Math.cos(t.a); fy = Math.sin(t.a);
  const rx = -fy, ry = fx;
  let vf = t.vx * fx + t.vy * fy;
  let vl = t.vx * rx + t.vy * ry;
  const vf0 = vf, vl0 = vl;

  if (thr) {
    if (vf < 0) vf += P.brake * dt;
    else vf += accel * Math.max(0, 1 - vf / topSpeed) * dt;
  }
  if (brk) {
    if (vf > 0) vf = Math.max(0, vf - P.brake * dt);
    else vf = Math.max(-P.reverseMax, vf - P.accel * 0.5 * (1 + vf / P.reverseMax) * dt);
  }
  vf -= vf * P.rollDrag * dt;

  const lim = P.latMax * (1 - P.throttleSlip * thr * Math.abs(st)) * dt;
  let cancel = vl * (1 - Math.exp(-P.latGrip * dt));
  if (Math.abs(cancel) > lim) cancel = Math.sign(cancel) * lim;
  vl -= cancel;
  t.slide = Math.abs(vl);

  // accelerations felt by the body (for lean)
  const sm = Math.min(1, dt * 8);
  t.lonAcc += ((vf - vf0) / dt - t.lonAcc) * sm;
  t.latAcc += ((st * Math.abs(vf) * P.steerRate * steerScale) * 0.5 + (vl0 - vl) / dt * 0.5 - t.latAcc) * sm;

  t.vx = fx * vf + rx * vl;
  t.vy = fy * vf + ry * vl;
  t.x += t.vx * dt;
  t.y += t.vy * dt;

  const n = nearest(t.x, t.y);
  const limD = HW - TRUCK_R;
  if (n.d > limD) {
    const ux = (t.x - n.px) / n.d, uy = (t.y - n.py) / n.d;
    t.x = n.px + ux * limD; t.y = n.py + uy * limD;
    const vn = t.vx * ux + t.vy * uy;
    if (vn > 0) {
      t.vx -= (1 + P.wallBounce) * vn * ux;
      t.vy -= (1 + P.wallBounce) * vn * uy;
      t.vx *= P.wallScrub; t.vy *= P.wallScrub;
      if (vn > 12) { sfxThud(vn / P.maxSpeed); dust(t.x + ux * 4, t.y + uy * 4, 6 + vn / 10, 1.5); t.bump = Math.min(1, vn / 80); }
    }
  }
  t.vf = vf; t.thr = thr;
  t.wheelRot -= vf * dt / 1.55;

  // laps
  const L = track.len, s = n.s;
  if (s > L * 0.4 && s < L * 0.6) t.halfway = true;
  if (t.prevS > L * 0.8 && s < L * 0.2) {
    if (!t.timing) { t.timing = true; t.lapStart = raceTime; t.halfway = false; }
    else if (t.halfway) {
      const lap = raceTime - t.lapStart;
      t.lastLap = lap; t.laps++;
      if (!t.best || lap < t.best) { t.best = lap; store("dd_best", lap); t.newBest = 2.5; }
      t.lapStart = raceTime; t.halfway = false;
    }
  } else if (t.prevS < L * 0.2 && s > L * 0.8) {
    t.halfway = false;
  }
  t.prevS = s;
  if (t.newBest) t.newBest = Math.max(0, t.newBest - dt);
  if (t.bump) t.bump = Math.max(0, t.bump - dt * 3);

  // nitro flames out of the exhaust
  if (boosting) {
    const ex = t.x - fx * 6.3 + rx * 1.9, ey = t.y - fy * 6.3 + ry * 1.9;
    for (let k = 0; k < 3; k++) flames.push({
      x: ex, y: ey, h: 2.2, vx: t.vx * 0.6 - fx * (30 + Math.random() * 30) + (Math.random() - .5) * 10,
      vy: t.vy * 0.6 - fy * (30 + Math.random() * 30) + (Math.random() - .5) * 10, vh: Math.random() * 3,
      life: 0, max: 0.15 + Math.random() * 0.15, r: 1.6 + Math.random()
    });
    if (flames.length > FLAME_MAX) flames.splice(0, flames.length - FLAME_MAX);
  }
  updatePickups(t, dt);

  // tyre marks + dust from the rear wheels
  const speed = Math.hypot(t.vx, t.vy);
  const marking = t.slide > 22 || (brk && vf > 30);
  for (const side of [-1, 1]) {
    const wx = t.x - fx * 3.5 + rx * side * 3.1, wy = t.y - fy * 3.5 + ry * side * 3.1;
    const key = side < 0 ? "wl" : "wr";
    if (marking && t[key]) addSkid(t[key][0], t[key][1], wx, wy, 1.4, Math.min(0.4, 0.1 + t.slide / 350));
    t[key] = [wx, wy];
    const rate = (speed > 25 ? speed / 200 : 0) + t.slide / 60 + (thr && speed < 40 ? 0.25 : 0);
    if (Math.random() < rate * dt * 30) dust(wx, wy, 1, 0.6 + t.slide / 90, -t.vx * 0.15, -t.vy * 0.15);
  }
}

function dust(x, y, count, size, bvx = 0, bvy = 0) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y, h: 0.6, vx: bvx + (Math.random() - 0.5) * 18, vy: bvy + (Math.random() - 0.5) * 18, vh: 3 + Math.random() * 5,
      life: 0, max: 0.5 + Math.random() * 0.7, r: (0.8 + Math.random() * 1.2) * size
    });
  }
  if (particles.length > DUST_MAX) particles.splice(0, particles.length - DUST_MAX);
}

function fireNitro() {
  const t = truck;
  if (t.nitros <= 0 || t.boost > 0) return;
  t.nitros--;
  t.boost = P.nitroTime;
  sfxNitro();
}

function spawnPickup() {
  const t = truck;
  for (let tries = 0; tries < 30; tries++) {
    const p = track.pts[(Math.random() * track.pts.length) | 0];
    const off = (Math.random() - 0.5) * (HW - 6) * 2;
    const x = p.x - p.ty * off, y = p.y + p.tx * off;
    if (Math.hypot(x - t.x, y - t.y) < 45) continue;
    if (pickups.some(q => Math.hypot(q.x - x, q.y - y) < 30)) continue;
    if (Math.hypot(x - track.pts[0].x, y - track.pts[0].y) < 10) continue;   // keep the start line clear
    const kind = Math.random() < 0.4 ? "nitro" : "cash";
    const value = kind === "cash" ? [50, 100, 100, 200, 500][(Math.random() * 5) | 0] : 1;
    const obj = makePickupModel(kind);
    obj.position.set(x, 0, y);
    obj.scale.setScalar(0.01);
    scene.add(obj);
    pickups.push({ kind, value, x, y, age: 0, obj, phase: Math.random() * 6 });
    return;
  }
}

function updatePickups(t, dt) {
  pickupTimer -= dt;
  if (pickupTimer <= 0 && pickups.length < 3) {
    spawnPickup();
    pickupTimer = P.pickupEvery * (0.6 + Math.random() * 0.8);
  }
  for (let i = pickups.length - 1; i >= 0; i--) {
    const q = pickups[i];
    q.age += dt;
    const got = Math.hypot(q.x - t.x, q.y - t.y) < 8.5;
    if (got || q.age > PICKUP_LIFE) {
      scene.remove(q.obj);
      pickups.splice(i, 1);
      if (got) {
        if (q.kind === "nitro") { t.nitros = Math.min(9, t.nitros + 1); popup("+1 NITRO", q.x, q.y, "#7cc0ff"); }
        else { t.cash += q.value; store("dd_cash", t.cash); popup("+$" + q.value, q.x, q.y, "#ffe27a"); }
        sfxPickup(q.kind);
      }
    }
  }
}

const popups = [];
function popup(text, x, y, color) { popups.push({ text, x, y, color, t: 0 }); }

function updateParticles(dt) {
  for (let i = flames.length - 1; i >= 0; i--) {
    const q = flames[i];
    q.life += dt;
    if (q.life > q.max) { flames.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.h += q.vh * dt;
  }
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].t += dt; if (popups[i].t > 1.2) popups.splice(i, 1); }
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.life += dt;
    if (q.life > q.max) { particles.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.h += q.vh * dt;
    q.vx *= 1 - 2.5 * dt; q.vy *= 1 - 2.5 * dt; q.vh *= 1 - 2 * dt;
  }
}

// ---------- Sync 3D objects with the simulation ----------
function syncScene(dt) {
  const t = truck;
  let a = t.a;
  if (classic) a = Math.round(a / (Math.PI / 8)) * (Math.PI / 8);   // 16 directions, like old sprite sets
  model.root.position.set(t.x, 0, t.y);
  model.root.rotation.y = -a;
  // body lean: roll from cornering, pitch from accelerating / braking, a jolt on wall hits
  const k = CAM.lean;
  const targetRoll = THREE.MathUtils.clamp(t.latAcc / 900, -0.16, 0.16) * k;
  const targetPitch = THREE.MathUtils.clamp(-t.lonAcc / 1800, -0.08, 0.08) * k;
  t.roll += (targetRoll - t.roll) * Math.min(1, dt * 10);
  t.pitch += (targetPitch - t.pitch) * Math.min(1, dt * 10);
  model.body.rotation.x = -t.roll;
  model.body.rotation.z = t.pitch + (t.bump || 0) * 0.08 * Math.sin(raceTime * 60);
  model.body.position.y = Math.abs(Math.sin(raceTime * 23)) * Math.min(1, Math.hypot(t.vx, t.vy) / 120) * 0.12;
  for (const w of model.wheels) {
    w.spin.rotation.z = t.wheelRot;
    if (w.front) w.steer.rotation.y = -t.steerVis;
  }

  // dust buffers
  let i = 0;
  for (const q of particles) {
    const f = q.life / q.max;
    dustPos[i * 3] = q.x; dustPos[i * 3 + 1] = q.h; dustPos[i * 3 + 2] = q.y;
    dustSize[i] = q.r * (1 + f * 1.8) * 2.2;
    dustAlpha[i] = 0.5 * (1 - f);
    i++;
  }
  dustGeo.setDrawRange(0, i);
  let j = 0;
  for (const q of flames) {
    const f = q.life / q.max;
    flamePos[j * 3] = q.x; flamePos[j * 3 + 1] = q.h; flamePos[j * 3 + 2] = q.y;
    flameSize[j] = q.r * (1 - f * 0.5) * 2.4;
    flameAlpha[j] = 0.9 * (1 - f);
    j++;
  }
  flameGeo.setDrawRange(0, j);
  flameGeo.attributes.position.needsUpdate = true;
  flameGeo.attributes.size.needsUpdate = true;
  flameGeo.attributes.alpha.needsUpdate = true;
  for (const q of pickups) {
    const grow = Math.min(1, q.age * 4);
    q.obj.scale.setScalar(grow * 1.6 * (1 + 0.04 * Math.sin(raceTime * 6 + q.phase)));
    const { spin, ring } = q.obj.userData;
    spin.rotation.y = raceTime * 2 + q.phase;
    spin.position.y = 0.6 + Math.sin(raceTime * 4 + q.phase) * 0.5;
    ring.material.opacity = 0.35 + 0.25 * Math.sin(raceTime * 6 + q.phase);
    // blink before vanishing
    q.obj.visible = q.age < PICKUP_LIFE - 2 || Math.floor(q.age * 8) % 2 === 0;
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustGeo.attributes.size.needsUpdate = true;
  dustGeo.attributes.alpha.needsUpdate = true;

  if (skidDirty) {
    skidGeo.setDrawRange(0, skidCount * 6);
    skidGeo.attributes.position.needsUpdate = true;
    skidGeo.attributes.color.needsUpdate = true;
    skidDirty = false;
  }
  debugLine.visible = debug;
}

// ---------- HUD (2D overlay) ----------
function fmt(t) {
  if (t == null) return "-:--.--";
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ":" + (s < 10 ? "0" : "") + s.toFixed(2);
}
function drawHUD() {
  const c = hctx, t = truck;

  c.fillStyle = t.boost > 0 ? "#7cc0ff" : sp > 0.85 ? "#ff6a3d" : "#ffc861"; c.fillRect(W - 49, H - 8, 44 * Math.min(1, sp / (t.boost > 0 ? P.nitroSpeed : 1)), 4);
  // cash + nitro bottles, bottom left
  c.fillStyle = "rgba(10,8,6,.62)"; c.fillRect(3, H - 13, 46 + Math.max(3, t.nitros) * 6, 11);
  c.font = classic ? "8px monospace" : "bold 7px 'Courier New', monospace";

  if (A.gear) { c.fillStyle = "#f2e6d0"; c.textAlign = "right"; c.fillText("GEAR " + A.gear, W - 4, H - 14); c.textAlign = "left"; }
  // floating "+$100" pop-ups above where things were picked up
  c.textAlign = "center";
  for (const q of popups) {
    const v = new THREE.Vector3(q.x, 8 + q.t * 10, q.y).project(camera);
    const sx = (v.x + 1) / 2 * W, sy = (1 - v.y) / 2 * H;
    c.globalAlpha = Math.min(1, 2.4 - q.t * 2);
    c.fillStyle = "rgba(0,0,0,.6)"; c.fillText(q.text, sx + 0.6, sy + 0.6);
    c.fillStyle = q.color; c.fillText(q.text, sx, sy);
  }

    c.textAlign = "left";
  }
  if (debug) {
    const n = nearest(t.x, t.y);

  }
}

// ---------- Sound: synthesised V8, skid hiss, thuds, nitro ----------
// The V8 is made entirely in code (see tools/engine_synth.js, kept in sync
// with the block between the ENGINE-SYNTH markers below). Seamless loops are
// rendered at several RPMs when sound starts; the two nearest the current
// rpm are blended and re-pitched to match it exactly.
// ENGINE-SYNTH-START
const ENGINE_LOOP_RPMS = [500, 1100, 2000, 3000, 4100, 5400];   // big, low-revving monster engine

function engineHash(a, b) {
  let h = (a * 374761393 + b * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function makeBiquad(type, f, q, sr) {
  const w = 2 * Math.PI * f / sr, cs = Math.cos(w), al = Math.sin(w) / (2 * q);
  let b0, b1, b2;
  if (type === "lp") { b0 = (1 - cs) / 2; b1 = 1 - cs; b2 = b0; }
  else if (type === "hp") { b0 = (1 + cs) / 2; b1 = -(1 + cs); b2 = b0; }
  else { b0 = al; b1 = 0; b2 = -al; }                 // band-pass, 0 dB peak
  const a0 = 1 + al, a1 = -2 * cs, a2 = 1 - al;
  const c = [b0 / a0, b1 / a0, b2 / a0, a1 / a0, a2 / a0];
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  return x => {
    const y = c[0] * x + c[1] * x1 + c[2] * x2 - c[3] * y1 - c[4] * y2;
    x2 = x1; x1 = x; y2 = y1; y1 = y;
    return y;
  };
}

function makeEngineLoop(sr, rpm, seed = 7) {
  const cycleSec = 120 / rpm;                          // two crank turns
  // near idle: big-cam lope, so make the loop longer so the lumpiness doesn't repeat too obviously
  const idleness = Math.max(0, Math.min(1, (1500 - rpm) / 1000));
  const cycles = Math.max(4, Math.round((1.1 + 1.1 * idleness) / cycleSec));
  const n = Math.round(cycles * cycleSec * sr);
  const fires = cycles * 8;
  const ORDER = [1, 8, 4, 3, 6, 5, 7, 2];
  const lope = 0.07 + 0.12 * idleness;                 // a little cylinder-to-cylinder roughness
  const cylAmp = [];
  for (let c = 1; c <= 8; c++) cylAmp[c] = 1 + (engineHash(seed, c) - 0.5) * 2 * lope;
  // Big-cam idle rhythm: in each engine cycle (8 firings) you mostly hear a big
  // thump and a smaller one right after it ("da-d"), then the rest drop back,
  // leaving a gap before the next pair. It fades away as the revs rise.
  const IDLE_PATTERN = [1.0, 0.68, 0.2, 0.28, 0.22, 0.3, 0.2, 0.26];

  // excitation for each bank, wrapped so the loop is seamless
  const ex = [new Float32Array(n), new Float32Array(n)];
  // near idle, pulses are shorter and ring less, so each cylinder is heard separately
  const width = Math.max(0.0016, (60 / rpm) * (0.11 - 0.045 * idleness)) * sr;   // pulse length in samples
  const decay = 3.2 + 2.4 * idleness;
  for (let k = 0; k < fires; k++) {
    const cyl = ORDER[k % 8];
    const bank = cyl % 2 ? 0 : 1;
    const jitT = (engineHash(seed + 11, k) - 0.5) * (0.0003 + 0.0016 * idleness) * sr;
    const start = k / fires * n + jitT;
    const amp = cylAmp[cyl] * (1 - idleness * (1 - IDLE_PATTERN[k % 8])) * (1 + (engineHash(seed + 23, k) - 0.5) * (0.12 + 0.15 * idleness));
    const len = Math.ceil(width * 4);
    for (let j = 0; j < len; j++) {
      const x = j / width;
      const shape = x < 0.18 ? x / 0.18 : Math.exp(-(x - 0.18) * decay);
      const grit = (engineHash(k * 977 + seed, j) - 0.5) * 0.45 * Math.exp(-x * 1.6);
      const idx = ((Math.floor(start) + j) % n + n) % n;
      ex[bank][idx] += amp * (shape + grit);
    }
  }

  // exhaust: each bank has its own pipe resonances
  const banks = [
    { res: [[56, 2.2, 1.3], [128, 3.0, 0.6], [400, 4.5, 0.12]], delay: 0 },
    { res: [[52, 2.2, 1.3], [140, 3.0, 0.6], [375, 4.5, 0.12]], delay: Math.round(0.0015 * sr) }
  ];
  const bright = 520 + rpm * 0.28;          // darker muffler = deeper tone
  const drive = 1.4 + rpm / 4000;
  const out = new Float32Array(n);
  const total = n * 3;
  const fil = banks.map(b => ({ bp: b.res.map(([f, q, g]) => [makeBiquad("bp", f, q * (1 - 0.3 * idleness), sr), g]), lp: makeBiquad("lp", 320, 0.7, sr), delay: b.delay }));
  const muffler = makeBiquad("lp", bright, 0.9, sr);
  const tinOut = new Float32Array(n);
  const tinHp = makeBiquad("hp", 1600, 0.7, sr);
  const tinBands = [[2700, 9, 1.0], [3900, 11, 0.7], [5300, 12, 0.4]].map(([f, q, g]) => [makeBiquad("bp", f, q, sr), g]);
  const muffler2 = makeBiquad("lp", bright * 1.6, 0.7, sr);
  const hp = makeBiquad("hp", 24, 0.7, sr);
  for (let i = 0; i < total; i++) {
    let s = 0;
    for (let b = 0; b < 2; b++) {
      const F = fil[b];
      const x = ex[b][((i - F.delay) % n + n) % n];
      let y = F.lp(x) * 1.1;                      // chesty low thump of each pulse
      for (const [f, g] of F.bp) y += f(x) * g * 2.2;
      s += y;
    }
    // tin layer from both banks' raw pulses
    const raw = ex[0][i % n] + ex[1][((i - fil[1].delay) % n + n) % n];
    const h = tinHp(raw);
    let tn = 0;
    for (const [bf, g] of tinBands) tn += bf(h) * g;
    if (i >= n && i < 2 * n) tinOut[i - n] = Math.tanh(tn * 1.5);
    s = hp(muffler2(muffler(s)));
    s = Math.tanh(s * drive * 0.6);
    if (i >= n && i < 2 * n) out[i - n] = s;
  }
  // normalise loudness (RMS) so the loops crossfade evenly
  let ss = 0;
  for (let i = 0; i < n; i++) ss += out[i] * out[i];
  const g = 0.32 / Math.sqrt(ss / n);
  let peak = 0;
  for (let i = 0; i < n; i++) { out[i] *= g; peak = Math.max(peak, Math.abs(out[i])); }
  if (peak > 0.98) for (let i = 0; i < n; i++) out[i] *= 0.98 / peak;
  // tin layer: scaled to a fixed level relative to the body (amount 1 = clearly audible)
  let ts = 0;
  for (let i = 0; i < n; i++) ts += tinOut[i] * tinOut[i];
  const tg = 0.08 / Math.sqrt(ts / n || 1);
  for (let i = 0; i < n; i++) tinOut[i] *= tg;
  return { body: out, tin: tinOut };
}

// Given the current rpm, which two loops to blend, how much of each, and
// the playback rate that brings each loop to exactly that rpm.
function engineMix(rpm) {
  const R = ENGINE_LOOP_RPMS;
  const r = Math.max(R[0] * 0.8, Math.min(R[R.length - 1] * 1.15, rpm));
  let i = 0;
  while (i < R.length - 2 && r > R[i + 1]) i++;
  const f = Math.max(0, Math.min(1, (r - R[i]) / (R[i + 1] - R[i])));
  const gains = R.map(() => 0);
  gains[i] = Math.cos(f * Math.PI / 2);
  gains[i + 1] = Math.sin(f * Math.PI / 2);
  return { gains, rates: R.map(x => r / x) };
}

// ---- Pretend gearbox (sound only) ----
// speed (0..1.2 of top speed) -> gear and engine rpm. Upshifts near the
// red line (~5000 rpm) with a short power cut; downshifts with a throttle blip.
// The supercharger whine is a separate live layer: pitch = rpm / 60 * BLOWER_RATIO.
const BLOWER_RATIO = 14;
const GEAR_TOPS = [0.32, 0.55, 0.8, 1.2];   // speed reached at the red line in each gear
function makeGearbox() { return { gear: 0, rpm: 500, cut: 0, blip: 0, shifted: 0, since: 1 }; }
function gearboxStep(g, sp, thr, boost, dt) {
  const inGear = i => 800 + Math.max(0, sp) / GEAR_TOPS[i] * 4500;
  g.shifted = 0;
  g.since += dt;
  if (g.cut > 0) g.cut -= dt;
  else if (thr && g.rpm > 5000 && g.gear < GEAR_TOPS.length - 1) { g.gear++; g.cut = 0.16; g.shifted = 1; g.since = 0; }
  else if (g.gear > 0 && g.since > 0.35 && inGear(g.gear) < (thr ? 2200 : 1400)) { g.gear--; g.cut = 0.1; g.blip = 0.16; g.shifted = -1; g.since = 0; }
  let target = inGear(g.gear);
  if (g.gear === 0 && thr && sp < 0.12) target = Math.max(target, 2000 + sp * 8000);   // launch / wheelspin
  if (g.gear === 0 && !thr && sp < 0.06) target = 500;                                 // clutch in, idling
  if (boost) target += 400;
  if (g.blip > 0) { g.blip -= dt; target += 700; }
  target = Math.max(480, Math.min(5900, target));
  const rate = g.cut > 0 ? 14 : target > g.rpm ? 6 : 3;
  g.rpm += (target - g.rpm) * Math.min(1, dt * rate);
  const load = g.blip > 0 || (thr && g.cut <= 0) ? 1 : 0;
  return { rpm: g.rpm, load, gear: g.gear + 1, shifted: g.shifted };
}
// ENGINE-SYNTH-END

let AC = null, A = {}, muted = recall("dd_muted") === true;
function initAudio() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  A.master = AC.createGain(); A.master.gain.value = muted ? 0 : 0.5;
  const comp = AC.createDynamicsCompressor();
  A.master.connect(comp); comp.connect(AC.destination);

  // engine: one looping source per RPM, mixed into a load filter
  A.engLp = AC.createBiquadFilter(); A.engLp.type = "lowpass"; A.engLp.frequency.value = 2000; A.engLp.Q.value = 0.6;
  A.engGain = AC.createGain(); A.engGain.gain.value = 0.4;
  A.engBass = AC.createBiquadFilter(); A.engBass.type = "lowshelf"; A.engBass.frequency.value = 140; A.engBass.gain.value = P.engineBass;
  A.engLp.connect(A.engBass); A.engBass.connect(A.engGain); A.engGain.connect(A.master);
  // thin metallic "tin" layer: bypasses the load filter, has its own level
  A.tinGain = AC.createGain(); A.tinGain.gain.value = 0;
  A.tinGain.connect(A.master);
  const startAt = AC.currentTime + 0.05;   // body and tin start together so they stay in step
  const mkSrc = (data, dest, g) => {
    const buf = AC.createBuffer(1, data.length, AC.sampleRate);
    buf.getChannelData(0).set(data);
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    src.connect(g); g.connect(dest); src.start(startAt);
    return src;
  };
  A.blowLp = AC.createBiquadFilter(); A.blowLp.type = "lowpass"; A.blowLp.frequency.value = 2600;
  A.blowGain = AC.createGain(); A.blowGain.gain.value = 0;
  A.blowLp.connect(A.blowGain); A.blowGain.connect(A.master);
  A.blow1 = AC.createOscillator(); A.blow1.type = "triangle";
  A.blow2 = AC.createOscillator(); A.blow2.type = "sine";
  const b2g = AC.createGain(); b2g.gain.value = 0.35;
  A.blow1.connect(A.blowLp); A.blow2.connect(b2g); b2g.connect(A.blowLp);
  A.blow1.start(); A.blow2.start();
  A.loops = ENGINE_LOOP_RPMS.map(rpm => {
    const { body, tin } = makeEngineLoop(AC.sampleRate, rpm);
    const g = AC.createGain(), tg = AC.createGain();
    g.gain.value = tg.gain.value = 0;
    return { src: mkSrc(body, A.engLp, g), tsrc: mkSrc(tin, A.tinGain, tg), g, tg };
  });
  A.gb = makeGearbox(); A.rpm = 500; A.load = 0; A.lastT = AC.currentTime; A.prevThr = 0; A.popUntil = 0;

  // noise for skids, thuds, pops and the nitro whoosh
  A.noise = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = A.noise.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const ns = AC.createBufferSource(); ns.buffer = A.noise; ns.loop = true;
  A.bp = AC.createBiquadFilter(); A.bp.type = "bandpass"; A.bp.frequency.value = 1100; A.bp.Q.value = 0.7;
  A.sg = AC.createGain(); A.sg.gain.value = 0;
  ns.connect(A.bp); A.bp.connect(A.sg); A.sg.connect(A.master); ns.start();
}

function updateAudio(t) {
  if (!AC || !A.loops) return;
  const now = AC.currentTime;
  const dt = Math.min(0.1, Math.max(0.001, now - A.lastT));
  A.lastT = now;
  // engine rpm from road speed through a pretend 4-speed gearbox
  const sp = Math.min(1.2, Math.abs(t.vf || 0) / Math.max(1, P.maxSpeed));
  const gs = gearboxStep(A.gb, sp, !!t.thr, t.boost > 0, dt);
  A.rpm = gs.rpm; A.load = gs.load; A.gear = gs.gear;
  const mix = engineMix(A.rpm + Math.sin(now * 9) * 12);
  A.loops.forEach((L, k) => {
    L.g.gain.setTargetAtTime(mix.gains[k], now, 0.03);
    L.tg.gain.setTargetAtTime(mix.gains[k], now, 0.03);
    L.src.playbackRate.setTargetAtTime(mix.rates[k], now, 0.03);
    L.tsrc.playbackRate.setTargetAtTime(mix.rates[k], now, 0.03);
  });
  // on the throttle the engine is louder and brighter; off it, muffled
  A.engLp.frequency.setTargetAtTime(A.load ? 5000 : 1500, now, A.load ? 0.05 : 0.1);
  A.engBass.gain.setTargetAtTime(P.engineBass, now, 0.1);
  const bf = A.rpm / 60 * BLOWER_RATIO;
  A.blow1.frequency.setTargetAtTime(bf, now, 0.03);
  A.blow2.frequency.setTargetAtTime(bf * 2, now, 0.03);
  A.blowGain.gain.setTargetAtTime(P.blowerWhine * (0.015 + 0.045 * A.load) * (0.4 + A.rpm / 5400), now, 0.06);
  A.engGain.gain.setTargetAtTime((A.load ? 0.55 : 0.36) + A.rpm / 40000, now, 0.06);
  A.tinGain.gain.setTargetAtTime(P.exhaustTin * (A.load ? 1 : 0.4), now, 0.08);
  // lift off at high revs: a few exhaust crackles
  if (A.prevThr && !A.load && A.rpm > 3000) A.popUntil = now + (gs.shifted ? 0.2 : 0.8);   // crackles on lift and on upshifts
  A.prevThr = A.load;
  if (now < A.popUntil && Math.random() < 0.14) sfxPop();
  A.sg.gain.setTargetAtTime(Math.max(0, Math.min(1, (t.slide - 20) / 70)) * 0.22, now, 0.05);
}

function sfxPop() {
  const now = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = A.noise;
  const bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 700 + Math.random() * 900; bp.Q.value = 1.4;
  const g = AC.createGain();
  const v = 0.25 + Math.random() * 0.35;
  g.gain.setValueAtTime(v, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
  src.connect(bp); bp.connect(g); g.connect(A.master);
  src.start(now, Math.random() * 0.8, 0.06);
}

function sfxNitro() {
  if (!AC) return;
  const now = AC.currentTime, len = P.nitroTime;
  // a soft low thump as the gas hits...
  const o = AC.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(90, now); o.frequency.exponentialRampToValueAtTime(38, now + 0.3);
  const og = AC.createGain();
  og.gain.setValueAtTime(0.5, now); og.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
  o.connect(og); og.connect(A.master); o.start(now); o.stop(now + 0.4);
  // ...then a rushing whoosh that rises and fades with the burst
  const src = AC.createBufferSource(); src.buffer = A.noise; src.loop = true;
  const bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.9;
  bp.frequency.setValueAtTime(400, now); bp.frequency.exponentialRampToValueAtTime(1800, now + len * 0.8);
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3500;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.001, now); g.gain.exponentialRampToValueAtTime(0.32, now + 0.12);
  g.gain.setValueAtTime(0.32, now + len * 0.75); g.gain.exponentialRampToValueAtTime(0.001, now + len + 0.25);
  src.connect(bp); bp.connect(lp); lp.connect(g); g.connect(A.master);
  src.start(now); src.stop(now + len + 0.3);
}
function sfxPickup(kind) {
  if (!AC) return;
  const now = AC.currentTime;
  const notes = kind === "nitro" ? [523, 784, 1046] : [880, 1175, 1568, 1760];
  notes.forEach((fq, i) => {
    const o = AC.createOscillator(); o.type = kind === "nitro" ? "triangle" : "square";
    const g = AC.createGain();
    const t0 = now + i * 0.06;
    o.frequency.value = fq;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
    o.connect(g); g.connect(A.master); o.start(t0); o.stop(t0 + 0.14);
  });
}
function sfxThud(strength) {
  if (!AC) return;
  const now = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = A.noise;
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 260;
  const g = AC.createGain();
  g.gain.setValueAtTime(Math.min(1, 0.3 + strength), now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
  src.connect(lp); lp.connect(g); g.connect(A.master);
  src.start(now, Math.random() * 0.5, 0.25);
}
function setMuted(m) {
  muted = m; store("dd_muted", m);
  if (A.master) A.master.gain.setTargetAtTime(m ? 0 : 0.5, AC.currentTime, 0.02);
}

// ---------- Input ----------
const KEYMAP = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
window.addEventListener("keydown", e => {
  initAudio();
  const k = KEYMAP[e.code];
  if (k) {
    if (e.code === "KeyD" && e.shiftKey) { debug = !debug; e.preventDefault(); return; }
    keys[k] = true; e.preventDefault(); return;
  }
  if (e.code === "KeyR") resetTruck();
  else if (e.code === "KeyG") { classic = !classic; store("dd_classic", classic); setMode(); }
  else if (e.code === "KeyT") document.getElementById("tune").hidden ^= 1;
  else if (e.code === "KeyM") setMuted(!muted);
  else if (e.code === "Space") { e.preventDefault(); if (!e.repeat) fireNitro(); }
}, true);
window.addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; }, true);
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

// ---------- Tuning panel ----------
function buildSliders(boxId, meta, obj, storeKey, onChange) {
  const box = document.getElementById(boxId);
  box.innerHTML = "";
  for (const [key, label, min, max, step] of meta) {
    const lab = document.createElement("label");
    const val = document.createElement("span");
    val.textContent = obj[key];
    lab.textContent = label; lab.appendChild(val);
    const inp = document.createElement("input");
    Object.assign(inp, { type: "range", min, max, step, value: obj[key] });
    inp.addEventListener("input", () => { obj[key] = +inp.value; val.textContent = inp.value; store(storeKey, obj); onChange && onChange(); });
    box.appendChild(lab); box.appendChild(inp);
  }
}
const buildTuning = () => buildSliders("sliders", PHYS_META, P, "dd_phys");
const buildCam = () => buildSliders("camSliders", CAM_META, CAM, "dd_cam", resize);
document.getElementById("tReset").onclick = () => { Object.assign(P, PHYS_DEFAULTS); store("dd_phys", P); buildTuning(); };
document.getElementById("cReset").onclick = () => { Object.assign(CAM, CAM_DEFAULTS); store("dd_cam", CAM); buildCam(); resize(); };
document.getElementById("tCopy").onclick = async (e) => {
  const txt = "const PHYS_DEFAULTS = " + JSON.stringify(P, null, 2) + ";\nconst CAM_DEFAULTS = " + JSON.stringify(CAM) + ";";
  try { await navigator.clipboard.writeText(txt); e.target.textContent = "Copied!"; }
  catch (err) {
    let ta = document.getElementById("tOut");
    if (!ta) { ta = document.createElement("textarea"); ta.id = "tOut"; ta.rows = 6; ta.style.cssText = "width:100%;margin-top:8px;background:#0e0b08;color:#e8dcc6;border:1px solid #5a4630;font:11px monospace"; document.getElementById("tune").appendChild(ta); }
    ta.value = txt; ta.select();
  }
  setTimeout(() => e.target.textContent = "Copy settings", 1200);
};

// ---------- Main loop ----------
setMode();
resetTruck();
buildTuning();
buildCam();
window.DD = { truck, keys, nearest, track, camera, CAM, pickups, fireNitro, audio: A };   // handy for testing in the console
let last = performance.now(), accT = 0;
function frame(now) {
  const real = Math.min(0.05, (now - last) / 1000);
  accT += real;
  last = now;
  while (accT >= STEP) {
    updateTruck(truck, STEP);
    updateParticles(STEP);
    raceTime += STEP;
    accT -= STEP;
  }
  syncScene(real);
  updateAudio(truck);
  renderer.render(scene, camera);
  drawHUD();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
